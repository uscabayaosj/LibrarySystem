{% extends "base.html" %}

{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
    <h1 class="display-6 mt-3">500 — Something Went Wrong</h1>
    <p class="lead text-muted">An unexpected error occurred. The team has been notified. Please try again.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">
        <i class="bi bi-house"></i> Back to Home
    </a>
</div>
{% endblock %}
