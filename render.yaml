# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Optional: Render's dashboard can configure all of this by hand instead. The
# value of keeping it here is that the two things easy to forget when clicking
# through the UI -- the persistent disk for logo uploads, and pointing
# DATABASE_URL at the managed Postgres -- are declared rather than remembered.
#
# To use: Render Dashboard -> New -> Blueprint -> pick this repo.

databases:
  - name: library-db
    databaseName: library
    plan: free

services:
  - type: web
    name: library-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before gunicorn binds, so the schema is current before
    # the app serves its first request.
    startCommand: python -c "from app import init_db; init_db()" && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login
    disk:
      # Uploaded org logos and their generated icon set live here. Without a
      # persistent disk they'd be wiped on every deploy.
      name: uploads
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true      # Render generates a strong value once and keeps it
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      # ADMIN_PASSWORD seeds the first admin account. Set it in the dashboard
      # rather than here so it isn't committed; if unset it defaults to
      # 'admin', which must be changed after the first sign-in.
