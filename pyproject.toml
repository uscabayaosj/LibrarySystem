[tool.poetry]
name = "library-system"
version = "2.0.0"
description = "Library Management System with admin (librarian) and user (borrower) dashboards"
authors = []
readme = "README.md"
# This is a deployed application, not a distributable package -- the code sits
# in flat modules (app.py, models.py, routes/) with no `library_system/`
# package directory. Without this, `poetry install` tries to install the
# project itself and fails with "No file/folder found for package
# library-system". Hosts that autodetect poetry.lock (Render among them) run
# a bare `poetry install`, so that failure is a broken deploy, not just a
# local annoyance.
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
flask-sqlalchemy = "^3.1.1"
flask = "^3.0.3"
flask-login = "^0.6.3"
flask-wtf = "^1.2.1"
psycopg2-binary = "^2.9.9"
pillow = "^12.3.0"
flask-migrate = "^4.1.0"
gunicorn = "^26.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

# A PEP 621 [project] table alongside Poetry's own [tool.poetry] tables above.
# This is not for Poetry -- poetry-core reads [tool.poetry.dependencies] and
# ignores this. It exists because Vercel's Python builder resolves
# dependencies with `uv`, and `uv lock` requires a standard [project] table;
# without one it fails outright with "No `project` table found in
# pyproject.toml" rather than falling back to requirements.txt. The pins here
# match requirements.txt exactly (both are downstream of poetry.lock) so
# there is one real set of versions, not two that can drift.
[project]
name = "library-system"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.3.0",
    "SQLAlchemy==2.0.34",
    "alembic==1.18.5",
    "gunicorn==26.0.0",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.9",
]

# The uv equivalent of Poetry's `package-mode = false` above: this is a
# deployed application, not a distributable package, and there is no
# `library_system/` package directory to build. Without this, `uv sync`
# (which Vercel's Python builder runs) tries to build the project itself as
# a wheel through poetry-core's build backend and fails -- the same failure
# Render's bare `poetry install` used to hit, resurfacing through a
# different installer.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"